<!-- ============================
SECTION CONTROLS — FAQ (Kids & Family)

IMAGES:
  none

FONT SIZES:
  --kids-faq-heading-size: 30px
  --kids-faq-question-size: 17px
  --kids-faq-answer-size: 15px
============================ -->
<section class="dw-kids-faq" id="faq">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-kids-faq {
      --kids-faq-heading-size: 30px;
      --kids-faq-question-size: 17px;
      --kids-faq-answer-size: 15px;
      background:#F6F2E9;
      padding:72px 24px;
    }
    .dw-kids-faq .dw-kids-faq-inner {
      max-width:760px;
      margin:0 auto;
    }
    .dw-kids-faq h2 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--kids-faq-heading-size);
      color:#211E17;
      text-align:center;
      margin:0 0 40px;
    }
    .dw-kids-faq .dw-faq-item {
      background:#FFFFFF;
      border:1px solid #E7E0CF;
      border-radius:12px;
      padding:22px 24px;
      margin-bottom:16px;
    }
    .dw-kids-faq .dw-faq-item h3 {
      font-family:'Karla',sans-serif;
      font-weight:700;
      font-size: var(--kids-faq-question-size);
      color:#211E17;
      margin:0 0 8px;
    }
    .dw-kids-faq .dw-faq-item p {
      font-family:'Karla',sans-serif;
      font-size: var(--kids-faq-answer-size);
      color:#5C5648;
      line-height:1.55;
      margin:0;
    }
  </style>

  <div class="dw-kids-faq-inner">
    <h2>Frequently asked questions</h2>
    <div class="dw-faq-item">
      <h3>My child doesn't sit still — is that a problem?</h3>
      <p>Not at all — we work at their pace and capture real moments, not forced ones.</p>
    </div>
    <div class="dw-faq-item">
      <h3>Can we do a cake smash and regular portraits together?</h3>
      <p>Yes, this is one of our most booked combinations.</p>
    </div>
  </div>
</section>
