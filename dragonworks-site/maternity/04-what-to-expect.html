<section class="dw-mat-expect">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-mat-expect {
      --mat-expect-heading-size: 30px;
      --mat-expect-body-size: 17px;
      background:#FFFFFF;
      padding:64px 24px;
    }
    .dw-mat-expect .dw-mat-expect-inner {
      max-width:720px;
      margin:0 auto;
      text-align:center;
    }
    .dw-mat-expect h2 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--mat-expect-heading-size);
      color:#211E17;
      margin:0 0 16px;
    }
    .dw-mat-expect p {
      font-family:'Karla',sans-serif;
      font-size: var(--mat-expect-body-size);
      line-height:1.6;
      color:#5C5648;
      margin:0;
    }
  </style>

  <div class="dw-mat-expect-inner">
    <h2>A relaxed, guided session</h2>
    <p>Full posing guidance, a comfortable changing room, and a team that moves at your pace — no rushing, no awkward direction.</p>
