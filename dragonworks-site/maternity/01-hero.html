<!-- ============================
SECTION CONTROLS — Hero (Maternity)

IMAGES:
  1. maternity-hero-main → large portrait photo, ratio 4:5, main visual

FONT SIZES:
  --mat-hero-eyebrow-size: 15px
  --mat-hero-heading-size: 46px
  --mat-hero-body-size: 18px
  --mat-hero-button-size: 16px
============================ -->
<section class="dw-mat-hero">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-mat-hero {
      --mat-hero-eyebrow-size: 15px;
      --mat-hero-heading-size: 46px;
      --mat-hero-body-size: 18px;
      --mat-hero-button-size: 16px;
      background:#F6F2E9;
      padding:72px 24px 56px;
    }
    .dw-mat-hero .dw-mat-hero-inner {
      max-width:1200px;
      margin:0 auto;
      display:grid;
      grid-template-columns:1.1fr 0.9fr;
      gap:56px;
      align-items:center;
    }
    .dw-mat-hero .dw-mat-hero-eyebrow {
      font-family:'Karla',sans-serif;
      font-size: var(--mat-hero-eyebrow-size);
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:1.5px;
      color:#1F4D3B;
      margin:0 0 16px;
    }
    .dw-mat-hero h1 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--mat-hero-heading-size);
      line-height:1.15;
      color:#211E17;
      margin:0 0 20px;
    }
    .dw-mat-hero p {
      font-family:'Karla',sans-serif;
      font-size: var(--mat-hero-body-size);
      line-height:1.6;
      color:#5C5648;
      margin:0 0 32px;
      max-width:520px;
    }
    .dw-mat-hero .dw-btn-primary {
      font-family:'Karla',sans-serif;
      font-size: var(--mat-hero-button-size);
      font-weight:700;
      color:#FFFFFF;
      background:#1F4D3B;
      text-decoration:none;
      padding:14px 28px;
      border-radius:999px;
      display:inline-block;
      transition:background 0.2s ease;
    }
    .dw-mat-hero .dw-btn-primary:hover {
      background:#163A2C;
    }
    .dw-mat-hero .dw-mat-hero-media img {
      width:100%;
      aspect-ratio:4/5;
      object-fit:cover;
      border-radius:16px;
      display:block;
    }

    @media (max-width: 900px) {
      .dw-mat-hero .dw-mat-hero-inner {
        grid-template-columns:1fr;
        gap:36px;
      }
      .dw-mat-hero h1 {
        font-size: calc(var(--mat-hero-heading-size) * 0.68);
      }
    }
  </style>

  <div class="dw-mat-hero-inner">
    <div class="dw-mat-hero-copy">
      <p class="dw-mat-hero-eyebrow">Maternity Photography</p>
      <h1>Celebrate this season, beautifully.</h1>
      <p>Soft, elegant maternity portraits — solo, with your partner, or the whole family — in a studio built to make you feel comfortable, not just photographed.</p>
      <a class="dw-btn-primary" href="/contact">Book Your Maternity Session</a>
    </div>
    <div class="dw-mat-hero-media">
      <img src="PASTE_IMAGE_LINK_HERE" data-slot="maternity-hero-main" alt="Maternity portrait session at DragonWorks studio">
    </div>
  </div>
</section>
