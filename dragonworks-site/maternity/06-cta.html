<!-- ============================
SECTION CONTROLS — CTA (Maternity)

IMAGES:
  none

FONT SIZES:
  --mat-cta-heading-size: 30px
  --mat-cta-button-size: 16px
============================ -->
<section class="dw-mat-cta">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-mat-cta {
      --mat-cta-heading-size: 30px;
      --mat-cta-button-size: 16px;
      background:#FFFFFF;
      padding:64px 24px;
      border-top:1px solid #E7E0CF;
      text-align:center;
    }
    .dw-mat-cta h2 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--mat-cta-heading-size);
      color:#211E17;
      margin:0 0 24px;
    }
    .dw-mat-cta .dw-btn-primary {
      font-family:'Karla',sans-serif;
      font-size: var(--mat-cta-button-size);
      font-weight:700;
      color:#FFFFFF;
      background:#1F4D3B;
      text-decoration:none;
      padding:14px 30px;
      border-radius:999px;
      display:inline-block;
      transition:background 0.2s ease;
    }
    .dw-mat-cta .dw-btn-primary:hover {
      background:#163A2C;
    }
  </style>

  <h2>Ready to celebrate your bump?</h2>
  <a class="dw-btn-primary" href="/contact">Book Your Session</a>
</section>
