<!-- ============================
SECTION CONTROLS — When To Book (Maternity)

IMAGES:
  none

FONT SIZES:
  --mat-note-heading-size: 30px
  --mat-note-body-size: 17px
============================ -->
<section class="dw-mat-note">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-mat-note {
      --mat-note-heading-size: 30px;
      --mat-note-body-size: 17px;
      background:#FFFFFF;
      padding:64px 24px;
      border-top:1px solid #E7E0CF;
      border-bottom:1px solid #E7E0CF;
    }
    .dw-mat-note .dw-mat-note-inner {
      max-width:720px;
      margin:0 auto;
      text-align:center;
    }
    .dw-mat-note h2 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--mat-note-heading-size);
      color:#211E17;
      margin:0 0 16px;
    }
    .dw-mat-note p {
      font-family:'Karla',sans-serif;
      font-size: var(--mat-note-body-size);
      line-height:1.6;
      color:#5C5648;
      margin:0;
    }
  </style>

  <div class="dw-mat-note-inner">
    <h2>When to book</h2>
    <p>The sweet spot is 28–34 weeks — enough of a bump to celebrate, still comfortable to move and pose.</p>
  </div>
</section>
