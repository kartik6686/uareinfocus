<!-- ============================
SECTION CONTROLS — FAQ (Maternity)

IMAGES:
  none

FONT SIZES:
  --mat-faq-heading-size: 30px
  --mat-faq-question-size: 17px
  --mat-faq-answer-size: 15px
============================ -->
<section class="dw-mat-faq" id="faq">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-mat-faq {
      --mat-faq-heading-size: 30px;
      --mat-faq-question-size: 17px;
      --mat-faq-answer-size: 15px;
      background:#F6F2E9;
      padding:72px 24px;
    }
    .dw-mat-faq .dw-mat-faq-inner {
      max-width:760px;
      margin:0 auto;
    }
    .dw-mat-faq h2 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--mat-faq-heading-size);
      color:#211E17;
      text-align:center;
      margin:0 0 40px;
    }
    .dw-mat-faq .dw-faq-item {
      background:#FFFFFF;
      border:1px solid #E7E0CF;
      border-radius:12px;
      padding:22px 24px;
      margin-bottom:16px;
    }
    .dw-mat-faq .dw-faq-item h3 {
      font-family:'Karla',sans-serif;
      font-weight:700;
      font-size: var(--mat-faq-question-size);
      color:#211E17;
      margin:0 0 8px;
    }
    .dw-mat-faq .dw-faq-item p {
      font-family:'Karla',sans-serif;
      font-size: var(--mat-faq-answer-size);
      color:#5C5648;
      line-height:1.55;
      margin:0;
    }
  </style>

  <div class="dw-mat-faq-inner">
    <h2>Frequently asked questions</h2>
    <div class="dw-faq-item">
      <h3>Can my partner or other kids join?</h3>
      <p>Absolutely — family participation is welcome.</p>
    </div>
    <div class="dw-faq-item">
      <h3>Do you provide outfits?</h3>
      <p>Yes, a studio dress collection is included; premium options available.</p>
    </div>
    <div class="dw-faq-item">
      <h3>Are photos edited?</h3>
      <p>Every final image is professionally edited before delivery.</p>
    </div>
  </div>
</section>
