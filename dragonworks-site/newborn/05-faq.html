<!-- ============================
SECTION CONTROLS — FAQ (Newborn)

IMAGES:
  none

FONT SIZES:
  --nb-faq-heading-size: 30px
  --nb-faq-question-size: 17px
  --nb-faq-answer-size: 15px
============================ -->
<section class="dw-nb-faq" id="faq">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-nb-faq {
      --nb-faq-heading-size: 30px;
      --nb-faq-question-size: 17px;
      --nb-faq-answer-size: 15px;
      background:#F6F2E9;
      padding:72px 24px;
    }
    .dw-nb-faq .dw-nb-faq-inner {
      max-width:760px;
      margin:0 auto;
    }
    .dw-nb-faq h2 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--nb-faq-heading-size);
      color:#211E17;
      text-align:center;
      margin:0 0 40px;
    }
    .dw-nb-faq .dw-faq-item {
      background:#FFFFFF;
      border:1px solid #E7E0CF;
      border-radius:12px;
      padding:22px 24px;
      margin-bottom:16px;
    }
    .dw-nb-faq .dw-faq-item h3 {
      font-family:'Karla',sans-serif;
      font-weight:700;
      font-size: var(--nb-faq-question-size);
      color:#211E17;
      margin:0 0 8px;
    }
    .dw-nb-faq .dw-faq-item p {
      font-family:'Karla',sans-serif;
      font-size: var(--nb-faq-answer-size);
      color:#5C5648;
      line-height:1.55;
      margin:0;
    }
  </style>

  <div class="dw-nb-faq-inner">
    <h2>Frequently asked questions</h2>
    <div class="dw-faq-item">
      <h3>Is it safe for such a young baby?</h3>
      <p>Yes — every session follows tested, baby-safe posing practices.</p>
    </div>
    <div class="dw-faq-item">
      <h3>What if my baby won't settle?</h3>
      <p>That's normal — we build in extra time and never force a shot.</p>
    </div>
  </div>
</section>
