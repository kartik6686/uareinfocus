<!-- ============================
SECTION CONTROLS — Hero (Newborn)

IMAGES:
  1. newborn-hero-main → large portrait photo, ratio 4:5, main visual

FONT SIZES:
  --nb-hero-eyebrow-size: 15px
  --nb-hero-heading-size: 46px
  --nb-hero-body-size: 18px
  --nb-hero-button-size: 16px
============================ -->
<section class="dw-nb-hero">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-nb-hero {
      --nb-hero-eyebrow-size: 15px;
      --nb-hero-heading-size: 46px;
      --nb-hero-body-size: 18px;
      --nb-hero-button-size: 16px;
      background:#F6F2E9;
      padding:72px 24px 56px;
    }
    .dw-nb-hero .dw-nb-hero-inner {
      max-width:1200px;
      margin:0 auto;
      display:grid;
      grid-template-columns:1.1fr 0.9fr;
      gap:56px;
      align-items:center;
    }
    .dw-nb-hero .dw-nb-hero-eyebrow {
      font-family:'Karla',sans-serif;
      font-size: var(--nb-hero-eyebrow-size);
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:1.5px;
      color:#1F4D3B;
      margin:0 0 16px;
    }
    .dw-nb-hero h1 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--nb-hero-heading-size);
      line-height:1.15;
      color:#211E17;
      margin:0 0 20px;
    }
    .dw-nb-hero p {
      font-family:'Karla',sans-serif;
      font-size: var(--nb-hero-body-size);
      line-height:1.6;
      color:#5C5648;
      margin:0 0 32px;
      max-width:520px;
    }
    .dw-nb-hero .dw-btn-primary {
      font-family:'Karla',sans-serif;
      font-size: var(--nb-hero-button-size);
      font-weight:700;
      color:#FFFFFF;
      background:#1F4D3B;
      text-decoration:none;
      padding:14px 28px;
      border-radius:999px;
      display:inline-block;
      transition:background 0.2s ease;
    }
    .dw-nb-hero .dw-btn-primary:hover {
      background:#163A2C;
    }
    .dw-nb-hero .dw-nb-hero-media img {
      width:100%;
      aspect-ratio:4/5;
      object-fit:cover;
      border-radius:16px;
      display:block;
    }

    @media (max-width: 900px) {
      .dw-nb-hero .dw-nb-hero-inner {
        grid-template-columns:1fr;
        gap:36px;
      }
      .dw-nb-hero h1 {
        font-size: calc(var(--nb-hero-heading-size) * 0.68);
      }
    }
  </style>

  <div class="dw-nb-hero-inner">
    <div class="dw-nb-hero-copy">
      <p class="dw-nb-hero-eyebrow">Newborn Photography</p>
      <h1>Their first days, gently kept.</h1>
      <p>Safe, unhurried newborn sessions — sleepy poses, tiny details, and space for the whole family to be part of it.</p>
      <a class="dw-btn-primary" href="/contact">Book Your Newborn Session</a>
    </div>
    <div class="dw-nb-hero-media">
      <img src="PASTE_IMAGE_LINK_HERE" data-slot="newborn-hero-main" alt="Newborn photography session at DragonWorks studio">
    </div>
  </div>
</section>
