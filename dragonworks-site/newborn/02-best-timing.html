<!-- ============================
SECTION CONTROLS — Best Timing (Newborn)

IMAGES:
  none

FONT SIZES:
  --nb-note-heading-size: 30px
  --nb-note-body-size: 17px
============================ -->
<section class="dw-nb-note">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-nb-note {
      --nb-note-heading-size: 30px;
      --nb-note-body-size: 17px;
      background:#FFFFFF;
      padding:64px 24px;
      border-top:1px solid #E7E0CF;
      border-bottom:1px solid #E7E0CF;
    }
    .dw-nb-note .dw-nb-note-inner {
      max-width:720px;
      margin:0 auto;
      text-align:center;
    }
    .dw-nb-note h2 {
      font-family:'Fraunces',serif;
      font-weight:700;
      font-size: var(--nb-note-heading-size);
      color:#211E17;
      margin:0 0 16px;
    }
    .dw-nb-note p {
      font-family:'Karla',sans-serif;
      font-size: var(--nb-note-body-size);
      line-height:1.6;
      color:#5C5648;
      margin:0;
    }
  </style>

  <div class="dw-nb-note-inner">
    <h2>Best timing</h2>
    <p>Within the first 5–15 days is ideal — babies sleep deepest and settle into poses more easily.</p>
  </div>
</section>
