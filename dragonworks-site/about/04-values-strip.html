<!-- ============================
SECTION CONTROLS — Values Strip (About)

IMAGES:
  none

FONT SIZES:
  --about-values-item-size: 15px
============================ -->
<section class="dw-about-values">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Karla:wght@400;500;700&display=swap');

    .dw-about-values {
      --about-values-item-size: 15px;
      background:#FFFFFF;
      padding:48px 24px;
      border-top:1px solid #E7E0CF;
      border-bottom:1px solid #E7E0CF;
    }
    .dw-about-values .dw-about-values-inner {
      max-width:1000px;
      margin:0 auto;
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
    }
    .dw-about-values .dw-value-pill {
      font-family:'Karla',sans-serif;
      font-size: var(--about-values-item-size);
      font-weight:700;
      color:#1F4D3B;
      background:#F6F2E9;
      border:1px solid #E7E0CF;
      border-radius:999px;
      padding:10px 20px;
    }
  </style>

  <div class="dw-about-values-inner">
    <span class="dw-value-pill">Family First</span>
    <span class="dw-value-pill">Creativity</span>
    <span class="dw-value-pill">Professionalism</span>
    <span class="dw-value-pill">Comfort</span>
    <span class="dw-value-pill">Safety</span>
    <span class="dw-value-pill">Honest Pricing</span>
    <span class="dw-value-pill">Reliability</span>
    <span class="dw-value-pill">Attention to Detail</span>
  </div>
</section>
